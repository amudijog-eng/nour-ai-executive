<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة مراقبة Softelv</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-card: rgba(15, 52, 96, 0.4);
            --accent-blue: #0f3460;
            --highlight-red: #e94560;
            --text-main: #ffffff;
            --text-muted: #a0a0b5;
            --status-online: #4caf50;
            --status-offline: #f44336;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        header {
            background: rgba(15, 52, 96, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--highlight-red);
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--status-offline);
            transition: background-color 0.3s ease;
        }
        .status-dot.connected { background-color: var(--status-online); box-shadow: 0 0 8px var(--status-online); }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 2rem;
            padding: 1.5rem 2rem;
            background: linear-gradient(to right, rgba(15, 52, 96, 0.3), transparent);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--highlight-red);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
        }

        /* Device Card */
        .device-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.5s ease forwards;
        }

        .device-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .device-name {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .device-badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
        }

        .thumbnail-container {
            width: 100%;
            height: 180px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--glass-border);
        }

        .thumbnail-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .no-signal {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .last-update {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: left;
        }

        .btn-watch {
            background: var(--highlight-red);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
        }

        .btn-watch:hover {
            background: #ff5c77;
        }
        
        .btn-watch:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            width: 100%;
            display: flex;
        }

        .live-screen-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        #liveImage {
            max-width: 100%;
            max-height: 90vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border-radius: 8px;
        }

        .sidebar {
            width: 300px;
            background: var(--bg-dark);
            border-right: 1px solid var(--glass-border);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .close-btn {
            align-self: flex-end;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }

        .info-item {
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .fps-counter {
            font-size: 1.2rem;
            color: #4caf50;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>لوحة مراقبة Softelv</h1>
        </div>
        <div class="connection-status">
            <span id="wsStatusText">جاري الاتصال...</span>
            <div id="wsStatusDot" class="status-dot"></div>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-value" id="statTotal">0</span>
            <span class="stat-label">إجمالي الأجهزة</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" style="color: var(--status-online)" id="statOnline">0</span>
            <span class="stat-label">متصلة</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" style="color: var(--status-offline)" id="statOffline">0</span>
            <span class="stat-label">غير متصلة</span>
        </div>
    </div>

    <div class="grid-container" id="deviceGrid">
        <!-- Cards will be dynamically inserted here -->
    </div>

    <!-- Live View Modal -->
    <div class="modal-overlay" id="liveModal">
        <div class="modal-content">
            <div class="sidebar">
                <button class="close-btn" onclick="closeLiveView()">&times;</button>
                <h2 id="modalDeviceName">اسم الجهاز</h2>
                
                <div class="info-item">
                    <div class="stat-label">نظام التشغيل</div>
                    <div id="modalOs" style="font-size: 1.1rem; margin-top: 0.3rem;">Android</div>
                </div>
                
                <div class="info-item">
                    <div class="stat-label">دقة الشاشة</div>
                    <div id="modalRes" style="font-size: 1.1rem; margin-top: 0.3rem;">1080x1920</div>
                </div>
                
                <div class="info-item">
                    <div class="stat-label">معدل الإطارات (FPS)</div>
                    <div id="modalFps" class="fps-counter">0</div>
                </div>
            </div>
            <div class="live-screen-area">
                <img id="liveImage" src="" alt="Live Stream">
            </div>
        </div>
    </div>

    <script>
        let ws;
        let devices = [];
        let currentWatchedId = null;
        let reconnectDelay = 1000;
        
        // FPS Calculation
        let frameCount = 0;
        let lastFpsTime = Date.now();
        
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/dashboard`;
            
            ws = new WebSocket(wsUrl);
            ws.binaryType = "blob";
            
            ws.onopen = () => {
                document.getElementById('wsStatusText').textContent = 'متصل';
                document.getElementById('wsStatusDot').classList.add('connected');
                reconnectDelay = 1000;
                
                // Re-subscribe if we were watching something
                if (currentWatchedId) {
                    ws.send(JSON.stringify({ type: 'watch', deviceId: currentWatchedId }));
                }
            };
            
            ws.onclose = () => {
                document.getElementById('wsStatusText').textContent = 'مفصول (جاري إعادة الاتصال...)';
                document.getElementById('wsStatusDot').classList.remove('connected');
                setTimeout(connectWebSocket, Math.min(reconnectDelay *= 1.5, 10000));
            };
            
            ws.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'device_list') {
                            devices = msg.devices;
                            renderDashboard();
                        }
                    } catch (e) {
                        console.error('Error parsing JSON:', e);
                    }
                } else if (event.data instanceof Blob) {
                    // Binary frame received
                    if (currentWatchedId) {
                        updateLiveFrame(event.data);
                    }
                }
            };
        }

        function renderDashboard() {
            const grid = document.getElementById('deviceGrid');
            grid.innerHTML = '';
            
            let online = 0;
            let offline = 0;
            
            devices.forEach(device => {
                if (device.status === 'online') online++;
                else offline++;
                
                const isOnline = device.status === 'online';
                const timeAgo = device.lastFrameTime ? formatTimeAgo(device.lastFrameTime) : 'لا يوجد بيانات';
                
                const card = document.createElement('div');
                card.className = 'device-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="device-name">${escapeHtml(device.model)}</div>
                            <div class="device-badges">
                                <span class="badge">${escapeHtml(device.manufacturer)}</span>
                                <span class="badge">Android ${escapeHtml(device.osVersion)}</span>
                                <span class="badge">${device.screenWidth}x${device.screenHeight}</span>
                            </div>
                        </div>
                        <div class="status-badge" style="color: ${isOnline ? 'var(--status-online)' : 'var(--status-offline)'}">
                            <div class="status-dot ${isOnline ? 'connected' : ''}" style="background-color: ${isOnline ? 'var(--status-online)' : 'var(--status-offline)'}; box-shadow: none;"></div>
                            ${isOnline ? 'متصل' : 'غير متصل'}
                        </div>
                    </div>
                    <div class="thumbnail-container">
                        <div class="no-signal">${isOnline ? 'جاهز للعرض' : 'لا توجد إشارة'}</div>
                    </div>
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto;">
                        <div class="last-update">آخر تحديث: ${timeAgo}</div>
                    </div>
                    <button class="btn-watch" onclick="openLiveView('${device.id}')" ${!isOnline ? 'disabled' : ''}>مشاهدة مباشرة</button>
                `;
                grid.appendChild(card);
            });
            
            document.getElementById('statTotal').textContent = devices.length;
            document.getElementById('statOnline').textContent = online;
            document.getElementById('statOffline').textContent = offline;
        }

        function openLiveView(deviceId) {
            const device = devices.find(d => d.id === deviceId);
            if (!device) return;
            
            currentWatchedId = deviceId;
            
            document.getElementById('modalDeviceName').textContent = device.model;
            document.getElementById('modalOs').textContent = 'Android ' + device.osVersion;
            document.getElementById('modalRes').textContent = device.screenWidth + 'x' + device.screenHeight;
            
            document.getElementById('liveModal').classList.add('active');
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'watch', deviceId }));
            }
            
            frameCount = 0;
            lastFpsTime = Date.now();
        }

        function closeLiveView() {
            document.getElementById('liveModal').classList.remove('active');
            if (ws && ws.readyState === WebSocket.OPEN && currentWatchedId) {
                ws.send(JSON.stringify({ type: 'unwatch' }));
            }
            currentWatchedId = null;
            document.getElementById('liveImage').src = '';
        }

        function updateLiveFrame(blob) {
            const url = URL.createObjectURL(blob);
            const img = document.getElementById('liveImage');
            
            // Revoke old URL to prevent memory leaks
            if (img.src && img.src.startsWith('blob:')) {
                URL.revokeObjectURL(img.src);
            }
            
            img.src = url;
            
            // Calculate FPS
            frameCount++;
            const now = Date.now();
            if (now - lastFpsTime >= 1000) {
                document.getElementById('modalFps').textContent = frameCount;
                frameCount = 0;
                lastFpsTime = now;
            }
        }

        function formatTimeAgo(timestamp) {
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return 'منذ لحظات';
            if (seconds < 3600) return `منذ ${Math.floor(seconds/60)} دقيقة`;
            return `منذ ${Math.floor(seconds/3600)} ساعة`;
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                 .toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Initial connection
        connectWebSocket();
        
        // Refresh time displays every minute
        setInterval(renderDashboard, 60000);
    </script>
</body>
</html>
